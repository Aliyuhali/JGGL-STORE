<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Language - JGGL-STORE</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


<link
    rel="stylesheet"
    href="style_v8.css?v=13"
>


</head>

<body>

<header class="details-header">

    <button
        type="button"
        class="back-btn"
        onclick="history.back()"
    >
        <i class="fas fa-arrow-left"></i>
    </button>

    <h2>Language</h2>

</header>

<main class="policy-page">

    <section class="policy-card">

        <div class="policy-heading">

            <i class="fas fa-language"></i>

            <div>

                <h3>Choose Language</h3>

                <p>
                    Select the language you want to use in JGGL-STORE.
                </p>

            </div>

        </div>

    </section>

    <section class="policy-card">

        <button
            type="button"
            class="language-option-btn"
            onclick="selectCustomerLanguage('English')"
        >
            <div>
                <strong>English</strong>
                <span>Use JGGL-STORE in English</span>
            </div>

            <i
                id="englishLanguageCheck"
                class="fas fa-circle-check"
            ></i>
        </button>

        <button
            type="button"
            class="language-option-btn"
            onclick="selectCustomerLanguage('Hausa')"
        >
            <div>
                <strong>Hausa</strong>
                <span>Yi amfani da JGGL-STORE da Hausa</span>
            </div>

            <i
                id="hausaLanguageCheck"
                class="fas fa-circle-check"
            ></i>
        </button>

    </section>

</main>

<nav class="bottom-nav">

    <a href="index.html" class="bottom-nav-item">
        <i class="fas fa-house"></i>
        <span>Home</span>
    </a>

    <a href="product-types.html" class="bottom-nav-item">
        <i class="fas fa-bag-shopping"></i>
        <span>Products</span>
    </a>

    <a href="cart.html" class="bottom-nav-item">
        <i class="fas fa-cart-shopping"></i>
        <span>Cart</span>
    </a>

    <a href="wishlist.html" class="bottom-nav-item">
        <i class="fas fa-heart"></i>
        <span>Wishlist</span>
    </a>

    <a
        href="account.html"
        class="bottom-nav-item active"
    >
        <i class="fas fa-user"></i>
        <span>Account</span>
    </a>

</nav>

<script src="products-data.js"></script>
<script src="script_v8.js?v=13"></script>

</body>

</html>
