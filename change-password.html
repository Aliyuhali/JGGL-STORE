<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - JGGL-STORE</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet"

href="style_v8.css?v=12"

</head>

<body>

<header class="details-header customer-page-header">

    <button
        type="button"
        class="back-btn"
        onclick="history.back()">

        <i class="fas fa-arrow-left"></i>

    </button>

    <h2>Change Password</h2>

</header>

<main>

    <section class="account-section">

        <form
            class="account-form"
            onsubmit="changePassword(event)">

            <div class="account-input">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Current Password"
                    required>

            </div>

            <div class="account-input">

                <i class="fas fa-key"></i>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                    required>

            </div>

            <div class="account-input">

                <i class="fas fa-key"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm New Password"
                    required>

            </div>

            <button
                type="submit"
                class="primary-btn">

                <i class="fas fa-save"></i>
                Change Password

            </button>

        </form>

    </section>

</main>

<script src="products-data.js"></script>
<script src="script_v8.js?v=13"></script>

</body>

</html>
