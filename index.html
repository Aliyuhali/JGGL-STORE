(function(){

        localStorage.getItem(
            "jgglOnboardingCompleted"
        ) === "true";

    const loggedIn =
        localStorage.getItem(
            "jgglLoggedIn"
        ) === "true";

    const token =
        localStorage.getItem(
            "jgglAuthToken"
        );

    const user =
        localStorage.getItem(
            "jgglUser"
        );

    if(
        !onboardingCompleted &&
        !(loggedIn && token && user)
    ){
        window.location.replace(

})();

<script>
window.onerror = function(message, source, line, column){
    const errorBox = document.createElement("div");

    errorBox.style.background = "#b00020";
    errorBox.style.color = "#ffffff";
    errorBox.style.padding = "10px";
    errorBox.style.margin = "10px";
    errorBox.style.fontSize = "12px";
    errorBox.style.position = "relative";
    errorBox.style.zIndex = "99999";

    errorBox.textContent =
        "JavaScript Error: " +
        message +
        " | Line: " +
        line;

    document.body.prepend(errorBox);
};
</script>

<script>
let jgglQrScanner = null;
let jgglQrTorchOn = false;

async function openQrScanner(){

    const modal =
        document.getElementById("qrScannerModal");

    const result =
        document.getElementById("qrScannerResult");

    if(!modal){
        return;
    }

    modal.style.display = "block";

    if(result){
        result.textContent = "Point camera at a QR code.";
    }

    try{

        if(jgglQrScanner){
            try{
                await jgglQrScanner.stop();
            }catch(error){}
            jgglQrScanner.clear();
        }

        jgglQrScanner =
            new Html5Qrcode("qr-reader");

        await jgglQrScanner.start(
            { facingMode: "environment" },
            {
                fps: 15,
                qrbox: {
                    width: 280,
                    height: 280
                },
                disableFlip: false
            },
            function(decodedText){

                if(result){
                    result.textContent =
                        "Result: " + decodedText;
                }

                const rawQr =
                    String(decodedText).trim();

                const productMatch =
                    rawQr.match(/^JGGL-PRODUCT:(\d+)$/i);

                const orderMatch =
                    rawQr.match(/^JGGL-ORDER:(.+)$/i);

                if(orderMatch){

                    const orderNumber =
                        String(orderMatch[1]).trim();

                    localStorage.setItem(
                        "selectedOrderId",
                        orderNumber
                    );

                    closeQrScanner().then(function(){
                        window.location.href =
                            "order-details.html";
                    });

                    return;
                }

                const scannedId =
                    productMatch
                        ? Number(productMatch[1])
                        : Number(rawQr);

                const matchedProduct =
                    PRODUCTS.find(function(product){
                        return Number(product.id) === scannedId;
                    });

                if(matchedProduct){

                    localStorage.setItem(
                        "selectedProductId",
                        String(matchedProduct.id)
                    );

                    closeQrScanner().then(function(){
                        window.location.href =
                            "product-details.html?v=38";
                    });

                }

            },
            function(){}
        );

        try{
            const capabilities =
                jgglQrScanner.getRunningTrackCapabilities();

            const advanced = [];

            if(capabilities.focusMode){
                advanced.push({
                    focusMode: "continuous"
                });
            }

            if(capabilities.zoom){
                const minZoom =
                    Number(capabilities.zoom.min || 1);

                const maxZoom =
                    Number(capabilities.zoom.max || 1);

                const zoomValue =
                    Math.min(
                        maxZoom,
                        Math.max(minZoom, 2)
                    );

                advanced.push({
                    zoom: zoomValue
                });
            }

            if(advanced.length){
                await jgglQrScanner.applyVideoConstraints({
                    advanced: advanced
                });
            }

        }catch(error){
            console.log(
                "QR camera enhancement unavailable:",
                error
            );
        }

    }catch(error){

        if(result){
            result.textContent =
                "Unable to start camera: " +
                error;
        }

    }

}



async function scanQrFromGallery(file){

    const result =
        document.getElementById("qrScannerResult");

    if(!file){
        return;
    }

    try{

        if(jgglQrScanner){

            try{
                await jgglQrScanner.stop();
            }catch(error){}

        }else{

            jgglQrScanner =
                new Html5Qrcode("qr-reader");

        }

        const decodedText =
            await jgglQrScanner.scanFile(
                file,
                true
            );

        if(result){
            result.textContent =
                "Result: " + decodedText;
        }

        const rawQr =
            String(decodedText).trim();

        const productMatch =
            rawQr.match(/^JGGL-PRODUCT:(\d+)$/i);

        const orderMatch =
            rawQr.match(/^JGGL-ORDER:(.+)$/i);

        if(orderMatch){

            const orderNumber =
                String(orderMatch[1]).trim();

            localStorage.setItem(
                "selectedOrderId",
                orderNumber
            );

            setTimeout(function(){
                window.location.href =
                    "order-details.html";
            }, 300);

            return;
        }

        const scannedId =
            productMatch
                ? Number(productMatch[1])
                : Number(rawQr);

        const matchedProduct =
            PRODUCTS.find(function(product){
                return Number(product.id) === scannedId;
            });

        if(matchedProduct){

            localStorage.setItem(
                "selectedProductId",
                String(matchedProduct.id)
            );

            setTimeout(function(){
                window.location.href =
                    "product-details.html?v=38";
            }, 300);

        }else{

            alert(
                "QR code was read, but no matching product or order was found."
            );

        }

    }catch(error){

        if(result){
            result.textContent =
                "Unable to read QR image.";
        }

        console.error(
            "QR GALLERY ERROR:",
            error
        );

    }

}

async function toggleQrTorch(){

    const button =
        document.getElementById("qrTorchBtn");

    if(!jgglQrScanner){
        return;
    }

    try{

        const nextState =
            !jgglQrTorchOn;

        await jgglQrScanner.applyVideoConstraints({
            advanced: [
                {
                    torch: nextState
                }
            ]
        });

        jgglQrTorchOn = nextState;

        if(button){
            button.textContent =
                jgglQrTorchOn
                    ? "Turn Off Flash"
                    : "Turn On Flash";
        }

    }catch(error){

        alert(
            "Flash is not supported on this camera."
        );

    }

}

async function closeQrScanner(){

    const modal =
        document.getElementById("qrScannerModal");

    if(jgglQrScanner){

        try{
            await jgglQrScanner.stop();
        }catch(error){}

        try{
            jgglQrScanner.clear();
        }catch(error){}

        jgglQrScanner = null;
    }

    if(modal){
        modal.style.display = "none";
    }

}

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const qrBtn =
            document.getElementById("qrBtn");

        const closeBtn =
            document.getElementById(
                "closeQrScannerBtn"
            );

        const torchBtn =
            document.getElementById("qrTorchBtn");

        const galleryBtn =
            document.getElementById("qrGalleryBtn");

        const galleryInput =
            document.getElementById("qrGalleryInput");

        if(qrBtn){
            qrBtn.addEventListener(
                "click",
                openQrScanner
            );
        }

        if(closeBtn){
            closeBtn.addEventListener(
                "click",
                closeQrScanner
            );
        }

        if(torchBtn){
            torchBtn.addEventListener(
                "click",
                toggleQrTorch
            );
        }

        if(galleryBtn && galleryInput){

            galleryBtn.addEventListener(
                "click",
                function(){
                    galleryInput.click();
                }
            );

            galleryInput.addEventListener(
                "change",
                function(event){

                    scanQrFromGallery(
                        event.target.files[0]
                    );

                }
            );

        }

    }
);
</script>
