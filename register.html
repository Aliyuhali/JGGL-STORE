<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account - JGGL-STORE</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link
        rel="stylesheet"
        href="style_v8.css?v=6">

</head>

<body>

<header class="details-header">

    <button
        type="button"
        class="back-btn"
        onclick="history.back()">

        <i class="fas fa-arrow-left"></i>

    </button>

    <h2>Create Account</h2>

</header>

<main>

    <section class="auth-section">

        <div class="auth-logo">

            <img
                src="logo/logo.png"
                alt="JGGL-STORE Logo">

            <h2>Join JGGL-STORE</h2>

            <p>Create your customer account</p>

        </div>

        <form
            class="auth-form"
            onsubmit="registerUser(event)">

            <div class="auth-input-group">

                <i class="fas fa-user"></i>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Full Name"
                    required>

            </div>

            <div class="auth-input-group">

                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email Address"
                    required>

            </div>

            <div class="auth-input-group">

                <i class="fas fa-phone"></i>

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="Phone Number"
                    required>

            </div>

            <div class="auth-input-group">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required>

                <button
                    type="button"
                    class="password-toggle"
                    onclick="toggleRegisterPassword()">

                    <i
                        id="registerPasswordIcon"
                        class="fas fa-eye"></i>

                </button>

            </div>

            <div class="auth-input-group">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="confirmRegisterPassword"
                    placeholder="Confirm Password"
                    required>

            </div>

            <button
                type="submit"
                class="auth-primary-btn">

                <i class="fas fa-user-plus"></i>

                Create Account

            </button>

        </form>

        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </section>

</main>

<nav class="bottom-nav">

    <a
        href="index.html"
        class="bottom-nav-item">

        <i class="fas fa-house"></i>
        <span>Home</span>

    </a>

    <a
        href="product-types.html"
        class="bottom-nav-item">

        <i class="fas fa-bag-shopping"></i>
        <span>Products</span>

    </a>

    <a
        href="cart.html"
        class="bottom-nav-item">

        <i class="fas fa-cart-shopping"></i>
        <span>Cart</span>

    </a>

    <a
        href="wishlist.html"
        class="bottom-nav-item">

        <i class="fas fa-heart"></i>
        <span>Wishlist</span>

    </a>

    <a
        href="account.html"
        class="bottom-nav-item active">

        <i class="fas fa-user"></i>
        <span>Account</span>

    </a>

</nav>

<script src="products-data.js"></script>
<script src="script_v8.js"></script>

</body>

</html>
