<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Settings | JGGL-STORE</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    rel="stylesheet"
    href="style_v8.css?v=10"
>

<link
    rel="stylesheet"
    href="admin.css?v=admin-nav-1"
>

</head>

<body>

<header class="top-header">

    <button
        type="button"
        class="back-btn"
        onclick="window.location.href='admin-dashboard.html'"
    >
        <i class="fas fa-arrow-left"></i>
        <span>Back</span>
    </button>

    <h2>Admin Settings</h2>

</header>

<main class="admin-settings-page">

<form
    id="adminSettingsForm"
    onsubmit="saveAdminSettings(event)"
>

<section class="admin-settings-card">

<h3>Store Information</h3>

<label>Store Name</label>
<input
    id="storeName"
    type="text"
    placeholder="JGGL-STORE"
/>

<label>Phone Number</label>
<input
    id="storePhone"
    type="tel"
/>

<label>WhatsApp Number</label>
<input
    id="storeWhatsapp"
    type="tel"
/>

<label>Email</label>
<input
    id="storeEmail"
    type="email"
/>

<label>Address</label>
<textarea
    id="storeAddress"
></textarea>

</section>

<section class="admin-settings-card">

<h3>Business Settings</h3>

<label>Currency</label>

<input
    id="storeCurrency"
    type="text"
    value="₦"
/>

<label>Delivery Fee</label>

<input
    id="deliveryFee"
    type="number"
/>

<label>Business Hours</label>

<input
    id="businessHours"
    type="text"
    placeholder="8:00 AM - 6:00 PM"
/>

</section>

<button
    type="submit"
    class="btn"
>

<i class="fas fa-save"></i>

Save Settings

</button>

</form>

</main>

<script src="script_v8.js?v=admin-nav-1"></script>

</body>
</html>
