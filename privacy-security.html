<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy & Security - JGGL-STORE</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style_v8.css?v=11">
</head>

<body>

<header class="details-header">

    <button
        type="button"
        class="back-btn"
        onclick="history.back()">

        <i class="fas fa-arrow-left"></i>

    </button>

    <h2>Privacy & Security</h2>

</header>

<main class="account-section">

    <div class="account-menu">


      <button
    type="button"
    class="account-menu-item"
    onclick="openChangePassword()"
>
    <i class="fas fa-key"></i>
    <span>Change Password</span>
</button>


<button
    type="button"
    class="account-menu-item"
    onclick="openLoginSecurity()"
>
    <i class="fas fa-mobile-screen"></i>
    <span>Login & Device Security</span>
</button>


<button
    type="button"
    class="account-menu-item"
    onclick="openPrivacyPolicy()"
>
    <i class="fas fa-user-shield"></i>
    <span>Privacy Policy</span>
</button>


<button
    type="button"

    class="account-menu-item"
    onclick="openTermsConditions()"
>
    <i class="fas fa-file-contract"></i>
    <span>Terms & Conditions</span>
</button>


<button
    type="button"
    class="account-menu-item"
    onclick="deleteCustomerAccount()"
>
    <i class="fas fa-trash"></i>
    <span>Delete Account</span>
</button>



    </div>

</main>

<nav class="bottom-nav">

    <a href="index.html" class="bottom-nav-item">
        <i class="fas fa-house"></i>
        <span>Home</span>
    </a>

    <a href="product-types.html" class="bottom-nav-item">
        <i class="fas fa-bag-shopping"></i>
        <span>Products</span>
    </a>

    <a href="cart.html" class="bottom-nav-item">
        <i class="fas fa-cart-shopping"></i>
        <span>Cart</span>
    </a>

    <a href="wishlist.html" class="bottom-nav-item">
        <i class="fas fa-heart"></i>
        <span>Wishlist</span>
    </a>

    <a href="account.html" class="bottom-nav-item active">
        <i class="fas fa-user"></i>
        <span>Account</span>
    </a>

</nav>

<script src="products-data.js"></script>
<script src="script_v8.js?v=13"></script>

</body>
</html>
