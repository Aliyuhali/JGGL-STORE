<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Customers</title>

    <link
        rel="stylesheet"
        href="style_v8.css?v=9">

<link rel="stylesheet" href="admin.css?v=1">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<header class="top-header">

    <button
        type="button"
        class="back-btn"
        onclick="history.back()"
    >

        <i class="fas fa-arrow-left"></i>

        <span>Back</span>

    </button>

    <h2>Admin Customers</h2>

</header>


<main class="admin-customers-page">


<section class="admin-summary-grid">

    <div class="admin-summary-card">

        <h2 id="totalCustomers">0</h2>

        <p>Total Customers</p>

    </div>

    <div class="admin-summary-card">

        <h2 id="activeCustomers">0</h2>

        <p>Active Customers</p>

    </div>

    <div class="admin-summary-card">

        <h2 id="newCustomers">0</h2>

        <p>New Customers</p>

    </div>

</section>


<section class="admin-search-section">

    <div class="admin-search-box">

        <i class="fas fa-search"></i>

        <input
            type="text"
            id="customerSearch"
            placeholder="Search customer...">

    </div>

</section>


<section class="admin-customers-list">

    <div id="customersContainer">

        <div class="admin-customer-card">

            <div class="admin-customer-info">

                <h3>Aliyu Salisu</h3>

                <p>
                    <i class="fas fa-phone"></i>
                    +2348000000000
                </p>

                <p>
                    <i class="fas fa-envelope"></i>
                    aliyu@example.com
                </p>

                <p>
                    <i class="fas fa-shopping-cart"></i>
                    Orders: 5
                </p>

                <p>
                    <i class="fas fa-money-bill-wave"></i>
                    ₦150,000
                </p>

            </div>

            <div class="admin-customer-actions">

                <button
                    class="admin-view-customer">

                    <i class="fas fa-eye"></i>

                    View

                </button>

                <button
                    class="admin-delete-customer">

                    <i class="fas fa-trash"></i>

                    Delete

                </button>

            </div>

        </div>

    </div>

</section>

</main>

<script src="script_v8.js?v=15"></script>

</body>

</html>
