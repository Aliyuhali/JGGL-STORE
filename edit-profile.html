<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - JGGL-STORE</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link
        rel="stylesheet"
        href="style_v8.css?v=customer-ui-1">

</head>

<body>

<header class="details-header customer-page-header">

    <button
        type="button"
        class="back-btn"
        onclick="history.back()">

        <i class="fas fa-arrow-left"></i>

    </button>

    <h2>Edit Profile</h2>

</header>

<main>

<section class="account-section">

<form
    class="account-form"
    onsubmit="saveProfile(event)">


<div class="account-menu-item">

<i class="fas fa-user"></i>

<input
type="text"
placeholder="Full Name">

</div>

<div class="account-menu-item">

<i class="fas fa-phone"></i>

<input
type="tel"
placeholder="Phone Number">

</div>

<div class="account-menu-item">

<i class="fas fa-envelope"></i>

<input
type="email"
placeholder="Email Address">

</div>

<div class="account-menu-item">

<i class="fas fa-road"></i>

<input
type="text"
placeholder="Street Address">

</div>

<div class="account-menu-item">

<i class="fas fa-building"></i>

<input
type="text"
placeholder="LGA">

</div>

<div class="account-menu-item">

<i class="fas fa-map"></i>

<input
type="text"
placeholder="State">

</div>

<div class="account-menu-item">

<i class="fas fa-globe-africa"></i>

<input
type="text"
placeholder="Country">

</div>

<button
type="submit"
class="checkout-btn">

<i class="fas fa-floppy-disk"></i>

Save Changes

</button>

</form>

</section>

</main>

<nav class="bottom-nav">

<a href="index.html" class="bottom-nav-item">
<i class="fas fa-house"></i>
<span>Home</span>
</a>

<a href="product-types.html" class="bottom-nav-item">
<i class="fas fa-bag-shopping"></i>
<span>Products</span>
</a>

<a href="cart.html" class="bottom-nav-item">
<i class="fas fa-cart-shopping"></i>
<span>Cart</span>
</a>

<a href="wishlist.html" class="bottom-nav-item">
<i class="fas fa-heart"></i>
<span>Wishlist</span>
</a>

<a href="account.html" class="bottom-nav-item active">
<i class="fas fa-user"></i>
<span>Account</span>
</a>

</nav>

<script src="products-data.js"></script>
<script src="script_v8.js"></script>

</body>

</html>
