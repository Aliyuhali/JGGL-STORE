<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - JGGL-STORE</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link
        rel="stylesheet"
        href="style_v8.css?v=auth-flow-3">

</head>

<body class="auth-page-body">

<header class="details-header customer-page-header">

    <button
        type="button"
        class="back-btn"
        onclick="history.back()">

        <i class="fas fa-arrow-left"></i>

    </button>

    <h2>Login</h2>

</header>

<main>

<section class="auth-section">

    <div class="auth-logo">

        <img
            src="logo/logo.png"
            alt="JGGL-STORE Logo">

        <h2>Welcome Back</h2>

        <p>Login to your JGGL-STORE account</p>

    </div>

    <form
        class="auth-form"
        onsubmit="loginUser(event)">

        <div class="auth-input-group">

            <i class="fas fa-envelope"></i>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required>

        </div>

        <div class="auth-input-group">

            <i class="fas fa-lock"></i>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required>

            <button
                type="button"
                class="password-toggle"
                onclick="toggleLoginPassword()">

                <i
                    id="loginPasswordIcon"
                    class="fas fa-eye"></i>

            </button>

        </div>

        <div class="auth-options">

            <label>

                <input
                    type="checkbox"
                    id="rememberLogin">

                Remember me

            </label>

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </div>

        <button
            type="submit"
            class="auth-primary-btn">

            <i class="fas fa-right-to-bracket"></i>

            Login

        </button>

    </form>

    <p class="auth-switch">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </p>

</section>

</main>

<script src="products-data.js"></script>
<script src="script_v8.js?v=auth-flow-3"></script>

</body>

</html>
