<script>


currentProduct = null;

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const productId =
            Number(
                localStorage.getItem(
                    "selectedProductId"
                )
            );

        if(!productId){
            return;
        }

        try{

            const response =
                await fetch(
                    API_BASE +
                    "/api/products/" +
                    encodeURIComponent(productId)
                );

            const data =
                await response.json();

            if(
                !response.ok ||
                !data.success ||
                !data.product
            ){

                throw new Error(
                    data.message ||
                    "Unable to load product."
                );

            }

            const dbProduct =
                data.product;

            const variants =
                Array.isArray(data.variants)
                    ? data.variants
                    : [];

            currentProduct = {
                id:
                    dbProduct.frontend_id ||
                    dbProduct.id,

                databaseId:
                    dbProduct.id,

                name:
                    dbProduct.product_name,

                group:
                    dbProduct.product_group ||
                    dbProduct.category,

                category:
                    dbProduct.category,

                brand:
                    dbProduct.brand || "",

                sku:
                    dbProduct.sku || "",

                description:
                    dbProduct.description || "",

                image:
                    dbProduct.image_url || "",

                price:
                    Number(
                        dbProduct.retail_price || 0
                    ),

                retailPrice:
                    Number(
                        dbProduct.retail_price || 0
                    ),

                wholesalePrice:
                    Number(
                        dbProduct.wholesale_price || 0
                    ),

                bulkPrice:
                    Number(
                        dbProduct.bulk_price || 0
                    ),

                wholesaleMinQty:
                    Number(
                        dbProduct.minimum_wholesale_quantity ||
                        1
                    ),

                bulkMinQty:
                    Number(
                        dbProduct.minimum_bulk_quantity ||
                        1
                    ),

                stock:
                    Math.max(
                        0,
                        Number(
                            dbProduct.stock_quantity || 0
                        ) -
                        Number(
                            dbProduct.reserved_stock || 0
                        )
                    ),

                reorderLevel:
                    Number(
                        dbProduct.reorder_level || 0
                    ),

                stockStatus:
                    dbProduct.stock_status || "",

                rating:
                    dbProduct.rating || 0,

                discount:
                    dbProduct.discount || 0,

                specifications:
                    dbProduct.specifications || {},

                related:
                    dbProduct.related_frontend_ids || [],

                variants:
                    variants.map(
                        function(variant){

                            return {
                                id:
                                    variant.id,

                                productId:
                                    variant.product_id,

                                label:
                                    variant.variant_name ||
                                    "",

                                sku:
                                    variant.sku || "",

                                color:
                                    variant.color || undefined,

                                storage:
                                    variant.storage || undefined,

                                ram:
                                    variant.ram || undefined,

                                weight:
                                    variant.weight || undefined,

                                packSize:
                                    variant.pack_size || undefined,

                                retailPrice:
                                    variant.retail_price !== null
                                        ? Number(
                                            variant.retail_price
                                        )
                                        : undefined,

                                wholesalePrice:
                                    variant.wholesale_price !== null
                                        ? Number(
                                            variant.wholesale_price
                                        )
                                        : undefined,

                                bulkPrice:
                                    variant.bulk_price !== null
                                        ? Number(
                                            variant.bulk_price
                                        )
                                        : undefined,

                                stock:
                                    Number(
                                        variant.stock_quantity ||
                                        0
                                    ),

                                image:
                                    variant.image_url || "",

                                specifications:
                                    variant.specifications || {}
                            };

                        }
                    )
            };

            const productImage =
                document.getElementById(
                    "productImage"
                );

            if(productImage){
                productImage.src =
                    currentProduct.image;

                productImage.alt =
                    currentProduct.name;
            }

            document.getElementById(
                "productName"
            ).textContent =
                currentProduct.name;

            document.getElementById(
                "productPrice"
            ).textContent =
                "₦" +
                Number(
                    currentProduct.price
                ).toLocaleString("en-NG");

            document.getElementById(
                "productCategory"
            ).textContent =
                currentProduct.group ||
                currentProduct.category ||
                "";

            document.getElementById(
                "productBrand"
            ).textContent =
                currentProduct.brand || "";

            document.getElementById(
                "productSku"
            ).textContent =
                currentProduct.sku || "";

            document.getElementById(
                "productRating"
            ).textContent =
                currentProduct.rating
                    ? currentProduct.rating + " / 5"
                    : "No rating";

            document.getElementById(
                "productReviews"
            ).textContent = "0";

            document.getElementById(
                "productDiscount"
            ).textContent =
                currentProduct.discount
                    ? currentProduct.discount + "%"
                    : "No discount";

            document.getElementById(
                "productDescription"
            ).textContent =
                currentProduct.description ||
                "No description available";

            loadProductSpecifications(
                currentProduct
            );

            loadProductVariants(
                currentProduct
            );

            selectPurchaseType(
                "retail"
            );

            updateCurrentProductAvailability();

        }catch(error){

            console.error(
                "LIVE PRODUCT DETAILS ERROR:",
                error
            );

            const name =
                document.getElementById(
                    "productName"
                );

            if(name){
                name.textContent =
                    "Unable to load product";
            }

        }

    }
);


let selectedVariantOptions = {};
let selectedProductVariant = null;



// ===========================================
// LOAD PRODUCT VARIANTS
// ===========================================

function loadProductVariants(product){

    const section =
        document.getElementById(
            "productVariantsSection"
        );

    const list =
        document.getElementById(
            "productVariantsList"
        );

    if(!section || !list){
        return;
    }

    const variants =
        product &&
        Array.isArray(product.variants)
            ? product.variants
            : [];

    list.innerHTML = "";

    if(variants.length === 0){

        section.style.display = "none";
        return;

    }

    const ignoredKeys = new Set([
        "id",
        "productId",
        "label",
        "price",
        "retailPrice",
        "wholesalePrice",
        "bulkPrice",
        "priceAdjustment",
        "stock",
        "sku",
        "image",
        "specifications"
    ]);

    const optionKeys = [];

    variants.forEach(function(variant){

        Object.keys(variant).forEach(function(key){

            if(
                !ignoredKeys.has(key) &&
                !optionKeys.includes(key)
            ){
                optionKeys.push(key);
            }

        });

    });

    if(optionKeys.length === 0){

        section.style.display = "none";
        return;

    }

    optionKeys.forEach(function(key){

        const values = [
            ...new Set(
                variants
                    .map(function(variant){
                        return variant[key];
                    })
                    .filter(function(value){
                        return (
                            value !== undefined &&
                            value !== null &&
                            value !== ""
                        );
                    })
            )
        ];

        if(values.length === 0){
            return;
        }

        const group =
            document.createElement("div");

        group.className =
            "product-variant-group";

        const heading =
            document.createElement("h4");

        heading.textContent =
            formatSpecificationLabel(key);

        const options =
            document.createElement("div");

        options.className =
            "product-variant-options";

        values.forEach(function(value){

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "product-variant-option-btn";

            button.textContent =
                String(value);

            button.dataset.variantKey =
                key;

            button.dataset.variantValue =
                String(value);



button.addEventListener(
    "click",
    function(){

        selectProductVariantOption(
            key,
            String(value),
            product,
            variants
        );

    }
);


            options.appendChild(button);

        });

        group.appendChild(heading);
        group.appendChild(options);
        list.appendChild(group);

    });



section.style.display =
    list.children.length > 0
        ? "block"
        : "none";

if (variants.length > 0) {

    selectedVariantOptions = {};

    optionKeys.forEach(function (key) {

        if (variants[0][key] !== undefined) {
            selectedVariantOptions[key] =
                String(variants[0][key]);
        }

    });

    selectedProductVariant = variants[0];

    applySelectedProductVariant(
        product,
        selectedProductVariant
    );

    document
        .querySelectorAll(".product-variant-option-btn")
        .forEach(function (button) {

            const key = button.dataset.variantKey;
            const value = button.dataset.variantValue;

            button.classList.toggle(
                "active",
                selectedVariantOptions[key] === value
            );

        });

}
}
   




// ===========================================
// SELECT PRODUCT VARIANT OPTION
// ===========================================

function selectProductVariantOption(
    key,
    value,
    product,
    variants
){

    selectedVariantOptions[key] = value;

    document
        .querySelectorAll(
            '.product-variant-option-btn[data-variant-key="' +
            key +
            '"]'
        )
        .forEach(function(button){

            button.classList.toggle(
                "active",
                button.dataset.variantValue ===
                    value
            );

        });

    const selectedKeys =
        Object.keys(selectedVariantOptions);

    selectedProductVariant =
        variants.find(function(variant){

            return selectedKeys.every(
                function(optionKey){

                    return String(
                        variant[optionKey]
                    ) === String(
                        selectedVariantOptions[
                            optionKey
                        ]
                    );

                }
            );

        }) || null;

    if(selectedProductVariant){

        applySelectedProductVariant(
            product,
            selectedProductVariant
        );

    }

}




// ===========================================
// APPLY SELECTED PRODUCT VARIANT
// ===========================================

function applySelectedProductVariant(
    product,
    variant
){

    const image =
        document.getElementById(
            "productImage"
        );

    const price =
        document.getElementById(
            "productPrice"
        );

    const sku =
        document.getElementById(
            "productSku"
        );

    const stock =
        document.getElementById(
            "productStock"
        );

    const stockStatus =
        document.getElementById(
            "productStockStatus"
        );

    const variantPrice =
        variant.price ??
        variant.retailPrice ??
        (
            Number(product.retailPrice || product.price || 0) +
            Number(variant.priceAdjustment || 0)
        );

    if(image && variant.image){
        image.src = variant.image;
    }

    if(price){
        price.textContent =
            "₦" +
            Number(variantPrice)
                .toLocaleString();
    }

    if(sku){
        sku.textContent =
            variant.sku ||
            product.sku ||
            "";
    }

    if(stock){
        stock.textContent =
            variant.stock ??
            product.stock ??
            0;
    }

    if(stockStatus){

        const availableStock =
            Number(
                variant.stock ??
                product.stock ??
                0
            );

        const reorderLevel =
            Number(
                product.reorderLevel || 0
            );

        stockStatus.textContent =
            availableStock <= 0
                ? "Out of Stock"
                : (
                    reorderLevel > 0 &&
                    availableStock <= reorderLevel
                        ? "Low Stock"
                        : "In Stock"
                );

    }

    updateCurrentProductAvailability();

    selectedPurchasePrice =
        Number(variantPrice);

    minimumPurchaseQuantity =
        purchaseType === "wholesale"
            ? (
                variant.wholesaleMinQty ||
                product.wholesaleMinQty ||
                5
            )
            : purchaseType === "bulk"
                ? (
                    variant.bulkMinQty ||
                    product.bulkMinQty ||
                    20
                )
                : 1;

    const selectedPrice =
        document.getElementById(
            "selectedPurchasePrice"
        );

    const minimumQuantity =
        document.getElementById(
            "minimumPurchaseQuantity"
        );

    if(selectedPrice){
        selectedPrice.textContent =
            "₦" +
            Number(selectedPurchasePrice)
                .toLocaleString();
    }

    if(minimumQuantity){
        minimumQuantity.textContent =
            minimumPurchaseQuantity;
    }

}





// ===========================================
// LOAD PRODUCT SPECIFICATIONS
// ===========================================


function loadProductSpecifications(product){

    const section = document.getElementById(
        "productSpecificationsSection"
    );

    const list = document.getElementById(
        "productSpecificationsList"
    );

    if(!section || !list){
        return;
    }

    const specifications =
        product &&
        product.specifications &&
        typeof product.specifications === "object"
            ? product.specifications
            : {};

    list.innerHTML = "";

    const iconMap = {
        model: "fa-mobile-screen-button",
        display: "fa-mobile-screen",
        processor: "fa-microchip",
        ram: "fa-memory",
        storage: "fa-hard-drive",
        battery: "fa-battery-full",
        camera: "fa-camera",
        operatingSystem: "fa-android",
        network: "fa-signal",
        warranty: "fa-shield-halved",
        weight: "fa-weight-hanging",
        packSize: "fa-box",
        ingredients: "fa-wheat-awn",
        manufacturingDate: "fa-calendar-check",
        expiryDate: "fa-calendar-xmark",
        storageInstructions: "fa-warehouse",
        countryOfOrigin: "fa-earth-africa",
        volume: "fa-bottle-water",
        size: "fa-ruler"
    };

    const category = String(
        product.category || ""
    ).toLowerCase();

    let priorityKeys;

    if(
        category.includes("electronic") ||
        category.includes("phone")
    ){
        priorityKeys = [
            "display",
            "ram",
            "storage",
            "battery",
            "camera",
            "operatingSystem"
        ];
    }else if(
        category.includes("food") ||
        category.includes("grocery")
    ){
        priorityKeys = [
            "weight",
            "packSize",
            "ingredients",
            "storageInstructions",
            "countryOfOrigin",
            "expiryDate"
        ];
    }else{
        priorityKeys = Object.keys(specifications);
    }

    const selectedKeys = [];

    priorityKeys.forEach(function(key){

        if(
            specifications[key] !== undefined &&
            specifications[key] !== null &&
            specifications[key] !== "" &&
            selectedKeys.length < 6
        ){
            selectedKeys.push(key);
        }

    });

    Object.keys(specifications).forEach(function(key){

        if(
            selectedKeys.length < 6 &&
            !selectedKeys.includes(key) &&
            specifications[key] !== undefined &&
            specifications[key] !== null &&
            specifications[key] !== ""
        ){
            selectedKeys.push(key);
        }

    });

    selectedKeys.forEach(function(key){

        const card = document.createElement("div");
        card.className = "smart-specification-card";

        const iconWrap = document.createElement("div");
        iconWrap.className = "smart-specification-icon";

        const icon = document.createElement("i");
        icon.className =
            "fas " +
            (iconMap[key] || "fa-circle-info");

        const content = document.createElement("div");
        content.className = "smart-specification-content";

        const label = document.createElement("strong");
        label.textContent =
            key === "operatingSystem"
                ? "OS"
                : formatSpecificationLabel(key);

        const value = document.createElement("span");
        value.textContent = String(specifications[key]);

        iconWrap.appendChild(icon);
        content.appendChild(label);
        content.appendChild(value);

        card.appendChild(iconWrap);
        card.appendChild(content);

        list.appendChild(card);

    });

    section.style.display =
        selectedKeys.length > 0
            ? "block"
            : "none";
}


// ===========================================
// FORMAT SPECIFICATION LABEL
// ===========================================

function formatSpecificationLabel(key){

    return String(key)
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, function(letter){
            return letter.toUpperCase();
        });

}



let purchaseType = "retail";
let selectedPurchasePrice = 0;
let minimumPurchaseQuantity = 1;


function getCurrentAvailableStock(){

    if(selectedProductVariant){

        return Math.max(
            0,
            Number(
                selectedProductVariant.stock || 0
            )
        );

    }

    if(!currentProduct){
        return 0;
    }

    return Math.max(
        0,
        Number(
            currentProduct.stock || 0
        )
    );

}


function updateCurrentProductAvailability(){

    if(!currentProduct){
        return;
    }

    const availableStock =
        getCurrentAvailableStock();

    const reorderLevel =
        Math.max(
            0,
            Number(
                currentProduct.reorderLevel || 0
            )
        );

    const stock =
        document.getElementById(
            "productStock"
        );

    const status =
        document.getElementById(
            "productStockStatus"
        );

    const addButton =
        document.querySelector(
            ".cart-btn"
        );

    const buyButton =
        document.querySelector(
            ".buy-btn"
        );

    if(stock){
        stock.textContent =
            String(availableStock);
    }

    let statusText =
        "In Stock";

    if(availableStock <= 0){

        statusText =
            "Out of Stock";

    }else if(
        reorderLevel > 0 &&
        availableStock <= reorderLevel
    ){

        statusText =
            "Low Stock";

    }

    if(status){

        status.textContent =
            statusText;

        status.dataset.status =
            statusText
                .toLowerCase()
                .replace(/\s+/g, "-");

    }

    const unavailable =
        availableStock <= 0;

    if(addButton){

        addButton.disabled =
            unavailable;

        addButton.setAttribute(
            "aria-disabled",
            unavailable
                ? "true"
                : "false"
        );

        const label =
            addButton.querySelector("span");

        if(label){

            label.textContent =
                unavailable
                    ? "Out of Stock"
                    : "Add to Cart";

        }

    }

    if(buyButton){

        buyButton.disabled =
            unavailable;

        buyButton.setAttribute(
            "aria-disabled",
            unavailable
                ? "true"
                : "false"
        );

        const label =
            buyButton.querySelector("span");

        if(label){

            label.textContent =
                unavailable
                    ? "Unavailable"
                    : "Buy Now";

        }

    }

}


function selectPurchaseType(type){

    if(!currentProduct){
        return;
    }

    purchaseType = type;

    const buttons =
        document.querySelectorAll(".purchase-type-btn");

    buttons.forEach(function(button){

        button.classList.remove("active");

        if(
            button.textContent.trim().toLowerCase() === type
        ){
            button.classList.add("active");
        }

    });

    if(type === "wholesale"){

        selectedPurchasePrice =
            currentProduct.wholesalePrice ||
            currentProduct.retailPrice ||
            currentProduct.price;

        minimumPurchaseQuantity =
            currentProduct.wholesaleMinQty || 5;

    }else if(type === "bulk"){

        selectedPurchasePrice =
            currentProduct.bulkPrice ||
            currentProduct.wholesalePrice ||
            currentProduct.retailPrice ||
            currentProduct.price;

        minimumPurchaseQuantity =
            currentProduct.bulkMinQty || 20;

    }else{

        selectedPurchasePrice =
            currentProduct.retailPrice ||
            currentProduct.price;

        minimumPurchaseQuantity = 1;

    }

    document.getElementById(
        "selectedPurchasePrice"
    ).textContent =
        "₦" +
        Number(selectedPurchasePrice)
            .toLocaleString("en-NG");

    document.getElementById(
        "minimumPurchaseQuantity"
    ).textContent =
        minimumPurchaseQuantity;

    document.getElementById(
        "productPrice"
    ).textContent =
        "₦" +
        Number(selectedPurchasePrice)
            .toLocaleString("en-NG");

}



function addCurrentProductToCart(){

    if(!currentProduct){
        return;
    }

    const availableStock =
        getCurrentAvailableStock();

    if(availableStock <= 0){

        alert(
            currentProduct.name +
            " is currently out of stock."
        );

        updateCurrentProductAvailability();
        return;
    }

    if(
        minimumPurchaseQuantity >
        availableStock
    ){

        alert(
            "Only " +
            availableStock +
            " item(s) are currently available."
        );

        return;
    }

    addToCart(
        currentProduct.name +
        " (" +
        purchaseType +
        ")",
        selectedPurchasePrice,
        (
            selectedProductVariant &&
            selectedProductVariant.image
        )
            ? selectedProductVariant.image
            : currentProduct.image,
        purchaseType,
        minimumPurchaseQuantity,
        minimumPurchaseQuantity,
        currentProduct.id,
        selectedProductVariant
            ? selectedProductVariant.id
            : null
    );

}

async function shareCurrentProductQr(){

    if(!currentProduct){
        alert("Product not found.");
        return;
    }

    const container =
        document.getElementById("productQrCode");

    if(!container){
        return;
    }

    const canvas =
        container.querySelector("canvas");

    if(!canvas){
        alert("QR image is not ready.");
        return;
    }

    const safeName =
        String(currentProduct.name || "Product")
            .trim()
            .replace(/[^a-zA-Z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");

    const fileName =
        "JGGL-" +
        String(currentProduct.id) +
        "-" +
        safeName +
        "-QR.png";

    canvas.toBlob(async function(blob){

        if(!blob){
            alert("Unable to share QR code.");
            return;
        }

        const file =
            new File(
                [blob],
                fileName,
                {
                    type: "image/png"
                }
            );

        const shareData = {
            title: currentProduct.name,
            text:
                "JGGL-STORE Product QR\n" +
                currentProduct.name +
                "\nProduct ID: " +
                currentProduct.id,
            files: [file]
        };

        try{

            if(
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ){

                await navigator.share(
                    shareData
                );

            }else if(navigator.share){

                await navigator.share({
                    title: currentProduct.name,
                    text: shareData.text
                });

            }else{

                alert(
                    "Sharing is not supported on this browser."
                );

            }

        }catch(error){

            if(error.name !== "AbortError"){
                console.error(
                    "QR SHARE ERROR:",
                    error
                );
            }

        }

    }, "image/png");

}

async function saveCurrentProductQr(){

    if(!currentProduct){
        alert("Product not found.");
        return;
    }

    const container =
        document.getElementById("productQrCode");

    if(!container){
        return;
    }

    const canvas =
        container.querySelector("canvas");

    if(!canvas){
        alert("QR image is not ready.");
        return;
    }

    const safeName =
        String(currentProduct.name || "Product")
            .trim()
            .replace(/[^a-zA-Z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");

    const fileName =
        "JGGL-" +
        String(currentProduct.id) +
        "-" +
        safeName +
        "-QR.png";

    canvas.toBlob(function(blob){

        if(!blob){
            alert("Unable to save QR code.");
            return;
        }

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;
        link.download = fileName;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(function(){
            URL.revokeObjectURL(url);
        }, 1000);

    }, "image/png");

}

function closeCurrentProductQr(){

    const modal =
        document.getElementById("productQrModal");

    if(modal){
        modal.style.display = "none";
    }

}

function addCurrentProductToWishlist(){

    if(!currentProduct){
        alert("Product not found.");
        return;
    }

    let wishlist = [];

    try{
        wishlist = JSON.parse(
            localStorage.getItem("wishlist") || "[]"
        );
    }catch(error){
        wishlist = [];
    }

    const exists = wishlist.some(function(item){
        return item.name === currentProduct.name;
    });

    if(!exists){

        wishlist.push({
            name: currentProduct.name,
            price: Number(currentProduct.price || 0),
            image: currentProduct.image
        });

        localStorage.setItem(
            "wishlist",
            JSON.stringify(wishlist)
        );
    }

    const badge =
        document.getElementById("wishlist-count");

    if(badge){
        badge.textContent = String(wishlist.length);
    }

    alert(
        exists
            ? "Product is already in your Wishlist ❤️"
            : "Product added to Wishlist ❤️"
    );

}



</script>


<script>


async function shareCurrentProduct(){

    if(!currentProduct){
        alert("Product information is not available.");
        return;
    }

    const price = Number(
        selectedPurchasePrice ||
        currentProduct.price ||
        currentProduct.retailPrice ||
        0
    );

    const shareText =
        "JGGL-STORE PRODUCT" +
        "\n\nProduct: " +
        currentProduct.name +
        "\nPrice: ₦" +
        price.toLocaleString() +
        "\nPurchase Type: " +
        (purchaseType || "retail") +
        "\n\nAvailable on JGGL-STORE";

    const shareData = {
        title: currentProduct.name,
        text: shareText
    };

    // FIRST: try sharing image + text
    if(currentProduct.image){

        try{

            const productImageElement =
                document.getElementById("productImage");

            const imageURL =
                productImageElement &&
                productImageElement.src
                    ? productImageElement.src
                    : currentProduct.image;

            const imageResponse =
                await fetch(imageURL);

            if(imageResponse.ok){

                const imageBlob =
                    await imageResponse.blob();

                const extension =
                    currentProduct.image
                        .split(".")
                        .pop()
                        .split("?")[0] ||
                    "png";

                const imageFile =
                    new File(
                        [imageBlob],
                        "jggl-product." + extension,
                        {
                            type:
                                imageBlob.type ||
                                "image/png"
                        }
                    );

                if(
                    navigator.share &&
                    navigator.canShare &&
                    navigator.canShare({
                        files: [imageFile]
                    })
                ){

                    await navigator.share({
                        title: shareData.title,
                        text: shareData.text,
                        files: [imageFile]
                    });

                    return;
                }

            }

        }catch(imageError){

            console.error(
                "PRODUCT IMAGE SHARE ERROR:",
                imageError
            );

        }

    }

    // SECOND: fallback to normal text share
    try{

        if(navigator.share){

            await navigator.share(
                shareData
            );

            return;
        }

    }catch(shareError){

        console.error(
            "PRODUCT TEXT SHARE ERROR:",
            shareError
        );

    }

    // THIRD: final fallback to clipboard
    if(navigator.clipboard){

        await navigator.clipboard.writeText(
            shareText
        );

        alert(
            "Product information copied successfully."
        );

    }else{

        alert(shareText);

    }

}
